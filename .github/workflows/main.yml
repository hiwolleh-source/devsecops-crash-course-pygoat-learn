name: CI

on: [push]

jobs:
  sast_scan:
    name: bandit scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2
      
      - name: setup python
        uses:  actions/setup-python@v2
        with:
          pyhton-version: 3.8

      - name: install banbit
        run: pip install bandit

      - name: run bandit scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json
        
      - name: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: build and run image scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: setup docker
        uses: docker/setup-buildx-action@v4.0.0

      - name: build docker image
        run: docker build -f Dockerfile -t practiceapp:latest .
        
      - name: docker login
        uses: docker/login-action@v4.0.0
        with:
          password: ${{ secrets.P }}
          username: ${{ vars.U }}
        
      - name: setup docker scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh

      - name: docker scout scan quickview
        run: docker scout quickview

      - name: docker scout scan cve
        run: |
            docker scout cves --format sarif --only-vuln-packages --only-severity critical,high -o scout-report.json
            docker scout cves --format markdown --only-vuln-packages --only-severity critical,high >> $GITHUB_STEP_SUMMARY
            
      - name: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-findings
          path: scout-report.json 
